{
  "gold_db": "/tmp/wealthdb-example/wealthdb.db",
  "default_currency": "CHF",
  "silver_sources": [
    {
      "id": "ubs",
      "kind": "ubs",
      "fx_priority": 0,
      "subsources": [
        {"kind": "ubs-web", "path": "/tmp/wealthdb-example/ubs-web/ubs-web.db"},
        {"kind": "ubs-psn", "path": "/tmp/wealthdb-example/ubs-psn/ubs-psn.db"}
      ],
      "relationships": [
        {"label": "Main", "web_id": "web-0001", "psn_id": "SFTPCHxx"}
      ]
    },
    {
      "id": "bank",
      "kind": "chase",
      "path": "/tmp/wealthdb-example/chase/chase.db",
      "taxable_wrapper": "taxable_joint"
    },
    {"id": "ct", "kind": "cointracking", "path": "/tmp/wealthdb-example/cointracking/cointracking.duckdb"},
    {"id": "fred", "kind": "fred", "path": "/tmp/wealthdb-example/fred/fred.db", "fx_priority": 1}
  ],
  "equity_transfers": "/tmp/wealthdb-example/ledgers/equity_transfers.csv",
  "account_overrides": {
    "bank": {
      "ACCT-1": {"nickname": "Everyday", "category": "cash"}
    }
  },
  "declared_accounts": {
    "kids-savings": {
      "account_kind": "cash",
      "tax_wrapper": "taxable_joint",
      "nickname": "Kids' savings",
      "currency": "CHF"
    }
  },
  "holding_aliases": [
    {"source": "ubs", "key": "isin:XX0000000001", "as": "isin:XX0000000002"}
  ],
  "portfolio_overrides": {
    "ct": {
      "P1": {"exclude": true}
    }
  },
  "instrument_overrides": {
    "bank": {
      "INSTR-1": {"asset_class": "metal", "vehicle": "etf"}
    }
  },
  "transaction_instruments": {
    "bank": {"TOKEN-1": "EX0000000001"}
  },
  "supersession": {
    "accounts": {"ct": {"WALLET1": "2023-03-10"}}
  },
  "inception_overrides": {
    "sources": {"ct": "2017-07-01"},
    "portfolios": {"ct": {"P2": "2019-09-24"}},
    "accounts": {"ct": {"WALLET2": "2020-01-01"}}
  },
  "returns_exclude": {
    "accounts": {"ct": ["WALLET3"]}
  },
  "returns_hide": {
    "accounts": {"bank": ["A1", "A2"]},
    "portfolios": {"ct": ["P3"]}
  },
  "returns_policy_overrides": {
    "ct": {"flow_regime": "nav_only"}
  },
  "returns_transfer_matching": {
    "enabled": true
  },
  "spending": {
    "internal_transfer_matching": {"window_days": 5, "tolerance_pct": 0.5},
    "rules": [{"match": "example", "category": "FOOD_AND_DRINK_COFFEE"}]
  },
  "income": {
    "rules": [{"match": "EXAMPLE PAYROLL", "type": "INCOME_SALARY"}]
  },
  "cashflow": {
    "projection": {"lookback_months": 12}
  },
  "symbol_resolution": {
    "model": {"baseUrl": "http://127.0.0.1:1/v1", "api": "openai-completions", "name": "example-model"},
    "overrides": [
      {"silver_source_id": "bank", "lookup_kind": "name", "lookup_value": "EXAMPLE FUND", "symbol": "VTI"}
    ]
  },
  "web": {
    "enabled": true,
    "port": 3000
  },
  "lots": {
    "method": "fifo"
  },
  "mcp": {
    "enabled": true,
    "port": 3300,
    "auth": "token"
  },
  "exposure": {
    "proxies": {
      "isin:XX0000000003": {"fund": "isin:XX0000000004", "always": true}
    },
    "max_gap_days": 200
  },
  "benchmarks": {
    "World 70/30": {"symbol:ACWI": 70, "symbol:BND": 30}
  },
  "yield": {
    "curves": {"USD": {"3M": "fred:DGS3MO"}},
    "horizon_months": 24
  }
