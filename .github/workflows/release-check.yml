# The tests a release needs beyond ci.yml, run by hand before a tag:
# Actions, "release-check", Run workflow, on the commit to be tagged.
# They take up to half an hour, too long for every push. Both test the
# native engine (wealthdb/docs/NATIVE.md):
#   - native: in the container `make test-native` builds, on Linux: the
#     suites that need no Docker, then an install to a prefix and a walk
#     end to end with both servers;
#   - native-macos: built on a Mac, its Go tests in a time zone far from
#     UTC, the suites of the launcher and the server scripts (a Mac has
#     its own sed and tar, and launchd), and an install with a walk end
#     to end under launchd.
# Like ci.yml, the job builds and runs the tree's own code, so it holds a
# read-only token and no secrets.
name: release-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Go tests are the go jobs' on this toolchain already, so the
  # suites here are the ones that go through the launcher and the server
  # scripts.
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test
        run: make test-native NATIVE_SUITES="demo web mcp wrappers"

  native-macos:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version-file: wealthdb/go.mod
          cache-dependency-path: wealthdb/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # PYTHON names the interpreter the job set up: ./configure would
      # otherwise prefer a newer python3.X of the runner's own.
      - name: Build
        run: |
          ./configure --engine=native --prefix="$RUNNER_TEMP/prefix" PYTHON="$(command -v python3)"
          make build-wealthdb build-web
      # A day that follows the computer's time zone fails here. Every
      # package runs at once on this runner's few cores, so a package
      # gets more than go test's ten minutes.
      - name: Go tests
        env:
          TZ: Pacific/Auckland
        run: make test-wealthdb GO_TEST_FLAGS="-count=1 -timeout 40m"
      # The suites of the launcher and the server scripts, which the
      # other jobs run on Linux alone: a Mac has its own sed and tar,
      # and launchd.
      - name: Shell suites
        env:
          TZ: Pacific/Auckland
        run: make test SUITES="wrappers mcp web"
      - name: Install, then walk end to end
        env:
          TZ: Pacific/Auckland
        run: |
          make install
          shared/native/e2e.sh "$RUNNER_TEMP/prefix/bin/wealthdb" "$PWD" "$RUNNER_TEMP/e2e"
