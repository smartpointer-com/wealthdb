# Checks every push to main and every pull request: the privacy check on
# what the change adds, `make lint`, and every suite `make test` runs.
# The suites run in jobs of their own, side by side:
#   - pii: the privacy check;
#   - lint: `make lint`;
#   - go: the engine's Go tests, two jobs for internal/gold and one
#     each for cmd/wealthdb and every other package;
#   - demo: the demo household through the engine;
#   - collectors: the shared base images and every collector's suite;
#   - rest: every other suite of `make test`;
#   - check: passes only when every job above has.
# .github/ci-suites.sh splits the Makefile's suite list between the
# jobs, so a new suite runs in CI without an edit here. It fails when a
# suite is claimed twice, or when the go, demo or collectors job claims
# one the list lacks. It cannot see this file: the jobs it assumes are
# the ones below.
# Every job runs on ubuntu-24.04: the free-disk paths and the job
# timeouts assume that image.
# The Go caches are restored in every run and saved only by pushes to
# main, also when a run fails. A pull request restores main's.
# The jobs build and run the change's own code, so they hold a read-only
# token and no secrets, and a fork's pull request runs only once a
# maintainer approves the run (repository settings, Actions). The
# actions sit on major tags, which `make update` does not move.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Each push to main is a group of its own, so none is cancelled or
  # dropped from a queue: its run is the only one that reads its commits.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pii:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The rules and the allow list come from the base of the change,
      # never from the change (shared/pii/check_at.sh). A base the history
      # no longer holds, after main was rewritten, falls back to the
      # parent commit.
      - name: Privacy check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE:-none}^{commit}" 2>/dev/null; then
            BASE=HEAD~1
          fi
          shared/pii/check_at.sh "$BASE" range "$BASE" HEAD

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The Go module and build caches that wealthdb-go mounts into the
      # container. The module cache has one entry per module graph and
      # toolchain, and only this job saves it, after downloading every
      # module. Each job kind keeps a build cache of its own.
      - name: Restore the Go module cache
        id: gomod
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/wealthdb/go/go-mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('wealthdb/go.sum', 'wealthdb/Dockerfile') }}
      - name: Restore the Go build cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/wealthdb/go/go-build
          key: go-build-lint-${{ runner.os }}-${{ hashFiles('wealthdb/go.sum', 'wealthdb/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: go-build-lint-${{ runner.os }}-${{ hashFiles('wealthdb/go.sum', 'wealthdb/Dockerfile') }}-
      - name: Go modules
        run: |
          make build-wealthdb
          wealthdb/wealthdb-go mod download
      - name: Lint
        run: make lint
      - name: Save the Go module cache
        if: always() && github.event_name == 'push' && steps.gomod.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/wealthdb/go/go-mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('wealthdb/go.sum', 'wealthdb/Dockerfile') }}
      - name: Save the Go build cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/wealthdb/go/go-build
          key: go-build-lint-${{ runner.os }}-${{ hashFiles('wealthdb/go.sum', 'wealthdb/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}

  go:
    name: go (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # internal/gold in two legs by test name: its TestM tests
          # (materialize and migration, about 40 % of its time) and
          # every other one. -run and -skip of one pattern are exact
          # complements, so no test falls between them.
          - name: gold-m
            pkgs: ./internal/gold/
            flags: -run ^TestM
          - name: gold
            pkgs: ./internal/gold/
            flags: -skip ^TestM
          - name: cmd
            pkgs: ./cmd/wealthdb/
          # Every package the entries above do not name.
          - name: rest
            pkgs: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore the Go module cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/wealthdb/go/go-mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('wealthdb/go.sum', 'wealthdb/Dockerfile') }}
      - name: Restore the Go build cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/wealthdb/go/go-build
          key: go-build-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('wealthdb/go.sum', 'wealthdb/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: go-build-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('wealthdb/go.sum', 'wealthdb/Dockerfile') }}-
      # -count=1: Go cannot see the files DuckDB opens through C, so a
      # cached pass could hide a change.
      - name: Test
        env:
          PKGS: ${{ matrix.pkgs }}
          FLAGS: ${{ matrix.flags }}
          # The packages of the entries that name theirs.
          OWN: ./internal/gold/ ./cmd/wealthdb/
        run: |
          make build-wealthdb
          if [ -z "$PKGS" ]; then
            own=$(wealthdb/wealthdb-go list $OWN)
            PKGS=$(wealthdb/wealthdb-go list ./... | grep -vxF -e "$own" | tr '\n' ' ')
            [ -n "$PKGS" ] || { echo "no other package to test" >&2; exit 1; }
          fi
          make test-wealthdb WEALTHDB_PKGS="$PKGS" GO_TEST_FLAGS="-count=1 $FLAGS"
      - name: Save the Go build cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/wealthdb/go/go-build
          key: go-build-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('wealthdb/go.sum', 'wealthdb/Dockerfile') }}-${{ github.run_id }}-${{ github.run_attempt }}

  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test
        run: make test-demo

  collectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The browser base images need more disk than a fresh runner has
      # free. The delete runs while the job sets up, and the test step
      # waits up to 10 minutes for its exit status.
      - name: Free disk space
        run: |
          m="$RUNNER_TEMP/free-disk"
          (sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
           echo $? > "$m.tmp" && mv "$m.tmp" "$m") >/dev/null 2>&1 &
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils
      - name: Test
        run: |
          split=$(.github/ci-suites.sh)
          m="$RUNNER_TEMP/free-disk"
          for _ in $(seq 300); do [ -e "$m" ] && break; sleep 2; done
          [ -e "$m" ] || { echo "freeing disk space did not finish in 10 minutes" >&2; exit 1; }
          [ "$(cat "$m")" = 0 ] || { echo "freeing disk space failed" >&2; exit 1; }
          make test SUITES="$(echo "$split" | sed -n 's/^collectors=//p')"

  rest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils
      - name: Test
        run: |
          split=$(.github/ci-suites.sh)
          make test SUITES="$(echo "$split" | sed -n 's/^rest=//p')"

  # The one status check a ruleset needs, over every job. It runs
  # whatever its needs did, since a check skipped after a failed need
  # would count as passed, and it fails unless every need succeeded.
  check:
    needs: [pii, lint, go, demo, collectors, rest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || exit 1
          done
