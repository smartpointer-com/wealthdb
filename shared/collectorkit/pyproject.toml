[project]
name = "collectorkit"
version = "0.1.0"
description = "Shared utilities for wealthdb silver collectors (env/credentials, SQLite migrations, bronze artifacts, CLI helpers)."
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["collectorkit*"]
